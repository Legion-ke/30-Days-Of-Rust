# Auto-update progress badge in README by counting day-* folders (assumes 30 days total)
name: Update progress badge

# Allow this workflow to update repository contents (needed to commit README)
permissions:
  contents: write

on:
  push:
    paths:
      - "day-*"
      - "day-*/**"
      - ".github/workflows/update-progress.yml"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count day folders and update README
        run: |
          set -e
          TOTAL=30
          # Count top-level directories that start with "day-" (case-sensitive)
          COUNT=$(find . -maxdepth 1 -type d -name 'day-*' | wc -l | tr -d ' ')
          # compute percentage with one decimal place
          PERCENT=$(awk -v c="$COUNT" -v t="$TOTAL" 'BEGIN{ if(t==0){print "0.0"} else {printf "%.1f", (c/t*100)} }')
          BADGE_URL="https://img.shields.io/badge/Progress-${PERCENT}%25-yellow"
          echo "Found $COUNT day folders -> ${PERCENT}%"
          # replace existing badge line (if exists) or add badge at top
          if grep -q '!\[Progress Badge\]' README.md; then
            # Replace the badge URL only
            sed -i "s|!\[Progress Badge\](.*)|![Progress Badge](${BADGE_URL})|g" README.md
          else
            # Insert badge after first heading
            awk -v badge="![Progress Badge](${BADGE_URL})\n" 'NR==1{print; print badge; next}1' README.md > README.tmp && mv README.tmp README.md
          fi
          # Update the textual progress line too (if present)
          if grep -q '^Progress: ' README.md; then
            sed -i "s/^Progress: .*/Progress: ${COUNT} \/ ${TOTAL} (${PERCENT}%)/" README.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -q README.md; then
            git add README.md
            git commit -m "chore: update progress badge (${COUNT}/${TOTAL} — ${PERCENT}%)"
            git push
          else
            echo "No changes to README.md; nothing to commit."
          fi
